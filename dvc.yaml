
stages:
  validate_dataset:
    cmd: python data/validate.py
    deps:
      - data/validate.py
      - data/raw/ESC-50/audio
      - data/raw/ESC-50/meta/esc50.csv
    params:
      - data.expected_classes
      - data.expected_folds
      - data.sample_rate
      - data.duration
    outs:
      - reports/validation_report.json

  preprocess_audio:
    cmd: python src/preprocessing/audio_features.py
    deps:
      - src/preprocessing/audio_features.py
      - data/raw/ESC-50/audio
      - data/raw/ESC-50/meta/esc50.csv
      - reports/validation_report.json
    params:
      - data.data_dir
      - preprocessing.sample_rate
      - preprocessing.n_mels
      - preprocessing.n_fft
      - preprocessing.hop_length
    outs:
      - data/processed/features.npy
      - data/processed/labels.npy
      - data/processed/folds.npy
      - data/processed/metadata.csv

  train_baseline:
    cmd: python src/training/train_baseline.py
    deps:
      - src/training/train_baseline.py
      - data/processed/features.npy
      - data/processed/labels.npy
      - data/processed/folds.npy
    outs:
      - models/baseline_model.joblib
    metrics:
      - reports/baseline_metrics.json

  train_main:
    cmd: python src/training/train_main.py
    deps:
      - src/training/train_main.py
      - src/models/cnn.py
      - data/processed/features.npy
      - data/processed/labels.npy
      - data/processed/folds.npy
    outs:
      - models/main_cnn.pth
    metrics:
      - reports/main_cnn_metrics.json
